site_name: ADAPT-Agents Documentation
site_description: Modular Diagnostic Agents Library for RCA Workflows
site_author: ADAPT-Agents Contributors
site_url: https://adapt-agents.readthedocs.io

repo_name: ADAPT-Agents
repo_url: https://github.com/yourusername/ADAPT-Agents
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting_started.md
    - Quick Start: quickstart.md
    - Configuration: configuration.md
  - Agents:
    - Overview: agents_guide.md
    - Log Analyzer: agents/log_analyzer.md
    - Metrics Analyzer: agents/metrics_analyzer.md
    - Change Correlator: agents/change_correlator.md
    - Topology Inference: agents/topology_inference.md
    - Hypothesis Generator: agents/hypothesis_generator.md
    - Remediation Planner: agents/remediation_planner.md
  - Orchestration:
    - Overview: orchestration_guide.md
    - Patterns: patterns.md
    - Async Execution: async_execution.md
  - API Reference:
    - Agents: api/agents.md
    - Schemas: api/schemas.md
    - Orchestrator: api/orchestrator.md
    - LLM: api/llm.md
  - REST API:
    - Endpoints: api/rest_api.md
    - Authentication: api/auth.md
  - CLI:
    - Commands: cli/commands.md
    - Examples: cli/examples.md
  - Deployment:
    - Docker: deployment/docker.md
    - Kubernetes: deployment/kubernetes.md
    - Production: deployment/production.md
  - Advanced:
    - Caching: advanced/caching.md
    - Monitoring: advanced/monitoring.md
    - Security: advanced/security.md
    - Multi-tenancy: advanced/multi_tenancy.md
  - Contributing:
    - Guidelines: contributing.md
    - Development: development.md
  - Architecture: architecture.md
  - FAQ: faq.md
  - Changelog: changelog.md
