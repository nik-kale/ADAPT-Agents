[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --strict-markers
    --cov=agents
    --cov=schemas
    --cov=chains
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=80
    -W error
    --tb=short

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    async: Async tests

asyncio_mode = auto

filterwarnings =
    ignore::DeprecationWarning
