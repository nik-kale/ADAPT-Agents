groups:
  - name: adapt_agents_alerts
    interval: 30s
    rules:
      # High error rate
      - alert: HighAgentErrorRate
        expr: rate(adapt_agent_executions_total{status="failed"}[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate for {{ $labels.agent_name }}"
          description: "Agent {{ $labels.agent_name }} has {{ $value }} errors/sec"

      # Long execution time
      - alert: SlowAgentExecution
        expr: histogram_quantile(0.95, rate(adapt_agent_execution_duration_seconds_bucket[5m])) > 30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Slow execution for {{ $labels.agent_name }}"
          description: "95th percentile execution time is {{ $value }}s"

      # Low cache hit rate
      - alert: LowCacheHitRate
        expr: |
          sum(rate(adapt_cache_hits_total[5m])) /
          (sum(rate(adapt_cache_hits_total[5m])) + sum(rate(adapt_cache_misses_total[5m]))) < 0.5
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "Low cache hit rate"
          description: "Cache hit rate is {{ $value | humanizePercentage }}"

      # Too many active executions
      - alert: TooManyActiveExecutions
        expr: sum(adapt_active_agent_executions) > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Too many concurrent agent executions"
          description: "{{ $value }} agents currently executing"

      # Agent down
      - alert: AgentDown
        expr: up{job="adapt-agents"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ADAPT-Agents is down"
          description: "ADAPT-Agents instance {{ $labels.instance }} is down"
